
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ameer Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  

  <div class="container mt-5 pt-5" id="dashboardSection" style="display: none;">
    <h2 id="welcomeMessage"></h2>
    
    <!-- User Dashboard -->
    <div id="userDashboard" style="display: none;">
      <h3>Your Library</h3>
      <div id="userBookList" class="row"></div>

      <h4 class="mt-4">My Borrowed Books</h4>
      <div id="borrowedBooksList" class="row"></div>

      <h4 class="mt-4">My Borrowing History</h4>
      <ul id="userHistory" class="list-group"></ul>
    </div>

    <!-- Librarian Dashboard -->
    <div id="librarianDashboard" style="display: none;">
      <h3>Library Management</h3>
      
      <div id="librarianBookList" class="row mt-4"></div>

      <h4 class="mt-4">All Borrowing History</h4>
      <ul id="librarianHistory" class="list-group"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
